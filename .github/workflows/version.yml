name: Version

# Turns the changesets on main into a "Version Packages" pull request: the version bump, the
# CHANGELOG entry, and `pnpm sync-version` so the PyPI package and the plugin manifest agree
# with npm. It publishes nothing — merging the PR and tagging the merge is what starts a
# release, and that is a decision a person makes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: version packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # v2 renamed these inputs: `version` -> `version-script`, `commit` -> `commit-message`,
      # `title` -> `pr-title`. It fails loudly rather than ignoring the old names, which is
      # how a Dependabot major bump was caught the same afternoon it landed.
      - uses: changesets/action@v2
        with:
          # One version across npm, PyPI, the plugin manifest and the GitHub release. Doing
          # it here rather than by hand is what stops them drifting apart between releases.
          version-script: pnpm changeset version && pnpm sync-version
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          # This workflow opens a pull request and does nothing else. No `publish` script, so
          # nothing is published; and neither of these, so it cannot tag or release either —
          # a tag from here would start the publish pipeline without anyone asking for it.
          create-github-releases: false
          push-git-tags: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
