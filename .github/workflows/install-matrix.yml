name: Install matrix

# The six documented ways to install delphi-team must all work and must all behave the
# same (docs/spec/PACKAGING_SPEC.md sections 5 and 8). This is slow and artifact-heavy,
# so it runs on demand and before a release rather than on every push.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  matrix:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Build the artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          node scripts/build-binaries.mjs
          (cd packages/cli && npm pack --pack-destination "$GITHUB_WORKSPACE/dist-artifacts")

          case "${{ runner.os }}" in
            Windows) target=bun-windows-x64; tag=py3-none-win_amd64; exe=delphi.exe ;;
            macOS)   target=bun-darwin-arm64; tag=py3-none-macosx_11_0_arm64; exe=delphi ;;
            Linux)   target=bun-linux-x64; tag=py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64; exe=delphi ;;
          esac
          cp "dist-binaries/$target/$exe" "python/src/delphi_team/bin/$exe"
          DELPHI_WHEEL_TAG="$tag" uv build --wheel python -o dist-artifacts

      - name: Expected version
        id: expected
        shell: bash
        run: echo "version=$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"

      # --- Node paths -------------------------------------------------------
      - name: npm install -g
        shell: bash
        run: |
          npm install -g dist-artifacts/*.tgz
          delphi --version | tee npm-version.txt
          delphi --help > npm-help.txt
          test "$(cat npm-version.txt)" = "${{ steps.expected.outputs.version }}"
          npm uninstall -g delphi-team

      - name: npx
        shell: bash
        run: test "$(npx --yes ./dist-artifacts/*.tgz --version)" = "${{ steps.expected.outputs.version }}"

      - name: pnpm dlx
        shell: bash
        run: test "$(pnpm dlx ./dist-artifacts/*.tgz --version)" = "${{ steps.expected.outputs.version }}"

      # --- Python paths -----------------------------------------------------
      - name: pipx install
        shell: bash
        run: |
          python -m pip install --upgrade pipx
          python -m pipx install dist-artifacts/*.whl
          "$(python -m pipx environment --value PIPX_BIN_DIR)/delphi" --version | tee pypi-version.txt
          "$(python -m pipx environment --value PIPX_BIN_DIR)/delphi" --help > pypi-help.txt
          test "$(cat pypi-version.txt)" = "${{ steps.expected.outputs.version }}"
          python -m pipx uninstall delphi-team

      - name: uvx
        shell: bash
        run: |
          whl=$(ls dist-artifacts/*.whl)
          test "$(uvx --from "$whl" delphi-team --version)" = "${{ steps.expected.outputs.version }}"

      - name: pip install
        shell: bash
        run: |
          python -m venv .venv-pip
          if [ "${{ runner.os }}" = "Windows" ]; then bin=.venv-pip/Scripts; else bin=.venv-pip/bin; fi
          "$bin/python" -m pip install dist-artifacts/*.whl
          test "$("$bin/delphi" --version)" = "${{ steps.expected.outputs.version }}"

      # --- The npm and PyPI builds must be indistinguishable ---------------
      - name: npm and PyPI output is identical
        shell: bash
        run: |
          diff npm-version.txt pypi-version.txt
          diff npm-help.txt pypi-help.txt
          echo "npm and PyPI distributions produce identical output"

      # --- ADR-0005: no silent npx fallback --------------------------------
      - name: An unsupported platform fails loudly
        shell: bash
        run: |
          python - <<'PY'
          import glob, pathlib, sys, tempfile, zipfile

          tmp = tempfile.mkdtemp()
          with zipfile.ZipFile(glob.glob('dist-artifacts/*.whl')[0]) as z:
              z.extractall(tmp)
          # Drop the binary to simulate a platform we publish no binary for.
          for p in pathlib.Path(tmp, 'delphi_team', 'bin').glob('delphi*'):
              p.unlink()

          sys.path.insert(0, tmp)
          from delphi_team import _shim

          try:
              _shim.main()
          except SystemExit as exc:
              assert exc.code == 1, f'expected exit 1, got {exc.code}'
              print('refused with exit 1 and an install hint, as ADR-0005 requires')
          else:
              raise AssertionError('the shim returned instead of refusing')
          PY
