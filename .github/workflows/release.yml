name: Release

# Publishing is a stop point. Nothing here reaches a registry without a person pressing
# approve: each publish job names a GitHub environment, and those environments carry
# required reviewers. A tag starts the pipeline; it does not finish it.
#
# The order follows PACKAGING_SPEC section 6 -- verify, build, npm, PyPI, GitHub release --
# with two amendments to it.
#
# C-020: npm goes to the *stage queue* rather than to the `next` tag, and you promote it on
# npmjs with 2FA instead of a second job moving a dist-tag. OIDC signs `npm publish` and
# `npm stage publish` and nothing else, so the dist-tag the spec describes would have
# required a permanent token in this repository -- the exact thing trusted publishing exists
# to remove. The first release is the one exception: npm cannot stage a package that does not
# exist yet, so it publishes directly with a short-lived token and every release after it is
# staged.
#
# C-022: there is no TestPyPI stage, by the owner's decision. What it guarded -- a broken
# wheel becoming permanent -- is checked before the gate instead: `twine check` on every
# distribution, and the wheels job runs the wheel it just built.
#
# Anything that can be checked is checked before anything is published.
#
# NOTE: the filename matters. npm trusted publishing is configured against this exact
# workflow filename, so renaming this file breaks publishing until npmjs is updated to match.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check everything, publish nothing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # `npm stage publish` needs 11.15.0+; trusted publishing needs 11.5.1+ on Node 22.14+.
  # Pinned rather than hoping: the runner's bundled npm trails a Node release for a while.
  NPM_VERSION: '11.15.0'

jobs:
  verify:
    name: verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Lint, build, typecheck, test
        run: pnpm check

      - name: The loop still stops when it should
        run: node scripts/loop-lab.mjs

      - id: version
        name: The tag and the package agree on the version
        run: |
          package=$(node -p "require('./packages/cli/package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          echo "version=$package" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$package" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag, packages/cli/package.json says $package."
            echo "::error::Run \`pnpm sync-version\` and tag the commit that changed it."
            exit 1
          fi
          echo "releasing $package"

      - name: Every distribution reports the same version
        run: |
          python=$(grep -oP '^version = "\K[^"]+' python/pyproject.toml)
          test "$python" = "${{ steps.version.outputs.version }}" || {
            echo "::error::python/pyproject.toml says $python. Run \`pnpm sync-version\`."
            exit 1
          }

      - name: The npm tarball is self-contained and carries its README
        run: |
          cd packages/cli && npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const [pack] = require("/tmp/pack.json")
            const names = pack.files.map((f) => f.path)
            for (const required of ["README.md", "README.vi.md", "dist/index.js"]) {
              if (!names.includes(required)) throw new Error(`the tarball is missing ${required}`)
            }
            console.log(`${names.length} files, ${(pack.size / 1024).toFixed(0)} KB`)
          '

  binaries:
    name: standalone binaries
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # bun cross-compiles every target from one host, which is why it was chosen over Node
      # SEA and pkg (ADR-0003). One runner, six binaries.
      - name: Compile every target
        run: |
          node scripts/build-binaries.mjs \
            bun-windows-x64 bun-darwin-arm64 bun-darwin-x64 \
            bun-linux-x64 bun-linux-arm64 bun-linux-x64-musl

      # Every binary is called `delphi`, which is right on a PATH and wrong as a release asset:
      # GitHub names an asset after the file, so six files called `delphi` collide and the
      # upload fails. Renaming here rather than at upload time means SHA256SUMS lists the names
      # people actually download, which is the only way `sha256sum -c` is any use to them.
      - name: Name each binary after its platform
        working-directory: dist-binaries
        run: |
          for dir in bun-*; do
            for file in "$dir"/*; do
              case "$file" in *.exe) ext=.exe ;; *) ext= ;; esac
              mv "$file" "delphi-${dir#bun-}$ext"
            done
            rmdir "$dir"
          done
          ls -l

      - name: Checksums
        working-directory: dist-binaries
        run: |
          find . -type f ! -name '*.sha256' -printf '%P\n' | sort | while read -r file; do
            sha256sum "$file" >> SHA256SUMS
          done
          cat SHA256SUMS

      # The SBOM is generated from the tarball that will actually be published, not from the
      # development tree. `npm sbom` cannot read a pnpm workspace at all -- it chokes on
      # `workspace:*` and on pnpm's node_modules layout -- and scanning the artifact is the
      # more truthful answer anyway: it lists what ships.
      - name: Pack the tarball the SBOM describes
        run: cd packages/cli && npm pack --pack-destination ../../dist-binaries

      - uses: anchore/sbom-action@v0
        with:
          path: dist-binaries
          format: cyclonedx-json
          output-file: dist-binaries/sbom.cdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist-binaries/
          retention-days: 7

  wheels:
    name: wheel (${{ matrix.target }})
    needs: binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: bun-windows-x64, asset: delphi-windows-x64.exe, tag: py3-none-win_amd64, exe: delphi.exe }
          - { target: bun-darwin-arm64, asset: delphi-darwin-arm64, tag: py3-none-macosx_11_0_arm64, exe: delphi }
          - { target: bun-darwin-x64, asset: delphi-darwin-x64, tag: py3-none-macosx_10_12_x86_64, exe: delphi }
          - { target: bun-linux-x64, asset: delphi-linux-x64, tag: py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64, exe: delphi }
          - { target: bun-linux-arm64, asset: delphi-linux-arm64, tag: py3-none-manylinux_2_17_aarch64.manylinux2014_aarch64, exe: delphi }
          - { target: bun-linux-x64-musl, asset: delphi-linux-x64-musl, tag: py3-none-musllinux_1_2_x86_64, exe: delphi }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist-binaries

      - name: Put this target's binary where the wheel looks for it
        run: |
          mkdir -p python/src/delphi_team/bin
          # The asset carries its platform; inside the wheel it goes back to the plain name,
          # because that is what `_shim.py` looks for.
          cp "dist-binaries/${{ matrix.asset }}" "python/src/delphi_team/bin/${{ matrix.exe }}"
          chmod +x "python/src/delphi_team/bin/${{ matrix.exe }}"

      - name: Build
        working-directory: python
        env:
          DELPHI_WHEEL_TAG: ${{ matrix.tag }}
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir ../dist-wheels

      # Does the wheel actually run? `twine check` reads metadata and never executes
      # anything, and with no TestPyPI stage (C-022) this is the last chance to find out
      # before a version number is spent forever. It guards the failure that already
      # happened once: a binary that is present but not runnable (C-021).
      #
      # Only the runner's own platform can be tried, so this covers one wheel of six. The
      # other five share every build step with it, so what it really proves is that the
      # recipe produces something that runs.
      - name: The wheel runs
        if: matrix.target == 'bun-linux-x64'
        run: |
          python -m pip install --quiet dist-wheels/*.whl
          delphi --version

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: dist-wheels/
          retention-days: 7

  sdist:
    name: sdist
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - working-directory: python
        run: |
          python -m pip install --quiet build
          python -m build --sdist --outdir ../dist-wheels
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist-wheels/
          retention-days: 7

  npm-stage:
    name: npm
    needs: [verify, binaries]
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    environment: npm-stage
    permissions:
      contents: read
      id-token: write # trusted publishing, and provenance
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Staged, never straight to the registry -- except once. A staged version is uploaded
      # but *not installable* by anyone until a human approves it on npmjs with a 2FA
      # challenge, which is a stronger gate than a dist-tag: a mistake is invisible to
      # everyone rather than merely unadvertised.
      #
      # The exception is the first release. npm cannot stage a package that does not exist
      # yet -- "you cannot stage a brand-new package" -- and it cannot configure trusted
      # publishing for one either. So the two exceptions line up exactly: the token branch
      # is the first publish and publishes directly, and once the package exists the token
      # is deleted and every release after it is staged under OIDC.
      - name: Publish
        working-directory: packages/cli
        env:
          # Deliberately not `NODE_AUTH_TOKEN`. `setup-node` writes an .npmrc containing
          # `_authToken=${NODE_AUTH_TOKEN}`, and an *empty* value there still counts as auth
          # being configured — so npm would never reach for OIDC. That breaks at exactly the
          # worst moment: the release after the token is deleted.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "First release: publishing directly, because a package that does not exist cannot be staged."
            NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish --provenance --access public
            echo "::notice::Published and installable now. Next: configure trusted publishing on npmjs, then DELETE the NPM_TOKEN secret. Every release after that is staged."
          else
            echo "Staging with trusted publishing (OIDC). Provenance is automatic."
            # No auth line at all, so the CLI looks for an OIDC token instead of sending
            # an empty one.
            rm -f "$HOME/.npmrc"
            npm stage publish --access public
            echo "::notice::Staged. Nobody can install it yet. Approve it with 'npm stage approve' or on npmjs -- either way you are challenged for 2FA."
          fi

  # There is no TestPyPI stage (C-022, the owner's call). That removes the only place a
  # broken wheel could have been found without spending a version number, so what it was
  # guarding is checked before the gate instead: the action runs `twine check` on every
  # distribution, and the wheels job runs the wheel it just built.
  pypi:
    name: PyPI
    needs: [wheels, sdist]
    # Without this the job would publish during a dry run. It used to inherit the skip from
    # `needs: testpypi`; deleting that job deleted the guard with it.
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '{wheel-*,sdist}'
          merge-multiple: true
          path: dist
      - run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    # `verify` is here for its output, not its ordering: the `needs` context exposes only
    # direct dependencies, so without it `needs.verify.outputs.version` is empty and the
    # release comes out titled "v". No dry run caught that, because they all skip this job.
    needs: [verify, npm-stage, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: '{binaries,wheel-*,sdist}'
          merge-multiple: true
          path: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "v$VERSION" \
            --generate-notes \
            --verify-tag \
            release/SHA256SUMS release/sbom.cdx.json \
            $(find release -type f \( -name 'delphi-*' -o -name '*.whl' -o -name '*.tar.gz' \) ! -name '*.tgz')
